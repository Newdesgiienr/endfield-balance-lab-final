name: Remove reward navigation

on:
  push:
    paths:
      - '.github/workflows/remove-reward-nav.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove reward navigation links from source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          skip = {'.git', '.github', 'version-json-backup', 'node_modules', '__pycache__'}
          line_pattern = re.compile(
              r'(?im)^[ \t]*<a\b[^>]*\bhref\s*=\s*["\'][^"\']*reward/index\.html(?:[?#][^"\']*)?["\'][^>]*>.*?</a>[ \t]*(?:\r?\n)?'
          )
          anchor_pattern = re.compile(
              r'<a\b[^>]*\bhref\s*=\s*["\'][^"\']*reward/index\.html(?:[?#][^"\']*)?["\'][^>]*>.*?</a>',
              re.I | re.S,
          )

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js'}:
                  continue
              if any(part in skip for part in path.parts):
                  continue
              raw = path.read_bytes()
              bom = raw.startswith(b'\xef\xbb\xbf')
              try:
                  text = raw.decode('utf-8-sig')
              except UnicodeDecodeError:
                  continue
              text2, n1 = line_pattern.subn('', text)
              text2, n2 = anchor_pattern.subn('', text2)
              if n1 + n2:
                  out = text2.encode('utf-8')
                  if bom:
                      out = b'\xef\xbb\xbf' + out
                  path.write_bytes(out)
                  changed.append((str(path), n1 + n2))

          print('Removed reward links:')
          for path, count in changed:
              print(f'  {path}: {count}')

          remaining = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js'}:
                  continue
              if any(part in skip for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8-sig')
              except (UnicodeDecodeError, OSError):
                  continue
              if 'reward/index.html' in text:
                  remaining.append(str(path))

          if remaining:
              print('ERROR: remaining reward/index.html references:')
              for path in remaining:
                  print(f'  {path}')
              raise SystemExit(1)
          print('Verification OK: no reward/index.html references remain in current HTML/JS.')
          PY

      - name: Restore CSS from pre-workaround backups
        shell: bash
        run: |
          find . -type f -name '*-original.css' -not -path './.git/*' -print0 | while IFS= read -r -d '' backup; do
            dest="${backup%-original.css}.css"
            echo "Restoring $dest from $backup"
            cp "$backup" "$dest"
            rm "$backup"
          done

      - name: Commit cleaned source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "보상 설계 메뉴 원본 제거"
          git push
